# tempo.ferhatsn.fr behind a reverse proxy (TLS ends there).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Redirects (/install → /install/) stay relative: the public host and
    # scheme are the proxy's, not this container's.
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;
    error_page 404 /404.html;

    # Pages: always checked again, so a new version shows at once.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Built files carry their hash in their name: cached for a year.
    location /_app/immutable/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Screenshots: the pages ask for them with their content fingerprint
    # (?v=, src/lib/assets.ts), so a new version has a new address and these
    # can be kept for a year.
    location /screenshots/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
