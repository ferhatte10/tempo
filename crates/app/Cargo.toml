[package]
name = "tempo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "See and manage your systemd user timers"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
futures-util = "0.3.34"
tempo-core = { path = "../core" }
rustix = { version = "1.1.6", default-features = false, features = ["time"] }
zbus = "6.1.0"

[lints]
workspace = true
