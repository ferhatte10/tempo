name: Check

# Every pull request and every push to main: formatting, lint, tests and the desktop file
# (`make check`). Built on Ubuntu 24.04, whose GTK 4.14 and libadwaita 1.5 are the oldest
# supported: an API newer than that fails the build. The tests that drive a real systemd
# (marked `ignored`) are not run here.

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - website/**
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - docs/**
      - website/**

# A new run on the same branch cancels the previous one (never on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gettext desktop-file-utils

      - name: Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: make check
        run: make check

      - name: ShellCheck
        run: shellcheck scripts/screenshots.sh
